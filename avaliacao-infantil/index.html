<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação infantil — Casa Oliveira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=Lora:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EE; --surface:#FAFCFA; --ink:#1C2B27; --muted:#55645E; --line:#D3DDD8;
  --accent:#2E6B5B; --accent-ink:#FFFFFF; --soft:#DDE9E3; --live:#C9831F; --danger:#A83A3A;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --lv0:#BFDDC8; --lv0-ink:#1D4A30; --lv1:#F2D98E; --lv1-ink:#5A4508; --lv2:#E9876C; --lv2-ink:#551A0B; --na:#E4E7E0; --empty:#E9ECE5;
  --r-familia:#B5621A; --r-escola:#2E62A0; --r-terapeuta:#2E6B5B; --r-crianca:#B03A6E;
  --rd1:#A9CFC1; --rd2:#6FAE97; --rd3:#3F8A72; --rd4:#1F5445; --rdref:#8C958E;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111916; --surface:#19231F; --ink:#E6EEEA; --muted:#9CB0A8; --line:#2B3934;
    --accent:#7CC3AE; --accent-ink:#0D1A15; --soft:#22322C; --live:#F0B44C; --danger:#E07B7B;
    --lv0:#2E5A3F; --lv0-ink:#D1EEDA; --lv1:#6E5C1E; --lv1-ink:#F8E9B6; --lv2:#8E3C29; --lv2-ink:#FFDCD1; --na:#2A312C; --empty:#262D28;
    --r-familia:#E39B55; --r-escola:#7FAAE0; --r-terapeuta:#7CC3AE; --r-crianca:#E580AE;
    --rd1:#3A5A4F; --rd2:#4F8A75; --rd3:#6FB39B; --rd4:#A6E0CA; --rdref:#7C867F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111916; --surface:#19231F; --ink:#E6EEEA; --muted:#9CB0A8; --line:#2B3934;
  --accent:#7CC3AE; --accent-ink:#0D1A15; --soft:#22322C; --live:#F0B44C; --danger:#E07B7B;
  --lv0:#2E5A3F; --lv0-ink:#D1EEDA; --lv1:#6E5C1E; --lv1-ink:#F8E9B6; --lv2:#8E3C29; --lv2-ink:#FFDCD1; --na:#2A312C; --empty:#262D28;
  --r-familia:#E39B55; --r-escola:#7FAAE0; --r-terapeuta:#7CC3AE; --r-crianca:#E580AE;
  --rd1:#3A5A4F; --rd2:#4F8A75; --rd3:#6FB39B; --rd4:#A6E0CA; --rdref:#7C867F;
}
html{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:20px 18px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 4px;line-height:1.2;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hint{font-size:14px;color:var(--muted)}
.small{font-size:13px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
select,input[type=text],input[type=date],input[type=month],input[type=search]{width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=number]{width:100%;min-height:48px;font:inherit;font-size:22px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:90px;font:15px/1.45 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
.row>.btn{flex:0 0 auto}
.btn{min-height:48px;font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--ink)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}
.btns{display:grid;gap:10px}.btns.two{grid-template-columns:1fr 1fr}
.linkbtn{background:none;border:0;padding:6px 0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;cursor:pointer;min-height:44px;text-align:left}
.patient{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.pfacts{font-size:14px;color:var(--muted)}
.pfacts b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin:18px -18px 16px;padding:4px 18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:44px;border:0;border-radius:9px;background:var(--soft);font-size:15px;padding:0 14px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.panel{display:grid;gap:14px}
.how{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px}
.how b{font-weight:700}
.warnbox{border:1.5px solid var(--live);border-radius:10px;padding:10px 12px;font-size:15px}
.err{border:1.5px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:15px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.list{display:grid;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:15px}
.list .it:first-child{border-top:0}
.list .it .l{min-width:0}
.list .it .l b{display:block}
.list .it .l span{font-size:13px;color:var(--muted)}
.list .it .acts{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.list button.mini{min-height:40px;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
.list button.mini.go{border-color:var(--accent);color:var(--accent);font-weight:600}
.list button.mini.armed{border-color:var(--danger);color:var(--danger)}
.done{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.todo{color:var(--muted);font-size:14px;white-space:nowrap}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(64px,20vw,104px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;padding-top:14px}
.bignum.sm{font-size:40px;padding:4px 0 10px}
.status{font-size:15px;color:var(--muted);text-align:center;margin-top:6px;padding:0 10px 12px}
.stage{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.metrics>div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.metrics .k{overflow-wrap:anywhere}
.metrics .v{font-family:var(--display);font-weight:700;font-size:26px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.15}
.metrics .k{font-size:13px;color:var(--muted);line-height:1.3}
.metrics .hot .v{color:var(--danger)}
.ktap{min-height:88px;font-size:24px;background:var(--live);border-color:var(--live);color:#1C1408}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 6px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* instrument form */
.field{display:grid;gap:4px}
.field .lim{font-weight:400;color:var(--muted)}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopts button{min-height:44px;flex:1 1 auto;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;font-size:15px;font-weight:600;padding:6px 10px;cursor:pointer}
.qopts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qopts.col{flex-direction:column}.qopts.col button{text-align:left;font-weight:500}
.qres{background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:8px}
.qres:empty{display:none}
.qres .qs{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qres .qs b{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.qres .mr{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px;border-top:1px solid var(--line);padding-top:6px}
.qres .mr:first-child{border-top:0;padding-top:0}
.qres .mr .v{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface);border:1.5px solid currentColor;white-space:nowrap}
.lvl.ok{color:#2E7D5B}.lvl.atencao{color:#8A6100}.lvl.alerta{color:#B4562A}.lvl.risco{color:#A83A3A}.lvl.na{color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lvl.ok{color:#7CC3AE}:root:not([data-theme="light"]) .lvl.atencao{color:#E8C25A}:root:not([data-theme="light"]) .lvl.alerta{color:#F0A070}:root:not([data-theme="light"]) .lvl.risco{color:#E07B7B}}
:root[data-theme="dark"] .lvl.ok{color:#7CC3AE}:root[data-theme="dark"] .lvl.atencao{color:#E8C25A}:root[data-theme="dark"] .lvl.alerta{color:#F0A070}:root[data-theme="dark"] .lvl.risco{color:#E07B7B}
.delta{font-size:13px;font-weight:700;white-space:nowrap}
.delta.up{color:var(--accent)}.delta.down{color:var(--danger)}.delta.eq{color:var(--muted)}
/* summary cards */
.icard-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.icard-h .d{font-size:13px;color:var(--muted);white-space:nowrap}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:15px;padding-block:5px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
details.evo{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
details.evo>summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:32px}
details.evo>summary::-webkit-details-marker{display:none}
details.evo>summary::after{content:'+';font-size:22px;color:var(--accent)}
details.evo[open]>summary::after{content:'–'}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.mini-h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;font-weight:700}
svg{display:block}
.mini svg,.radar svg{width:100%;height:auto}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-tick{fill:var(--muted);font-size:10px;font-family:var(--body)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-pt{fill:var(--accent);stroke:var(--surface);stroke-width:2;cursor:pointer}
.ch-hit,.rd-hit{fill:transparent;cursor:pointer}
.ch-lbl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--body)}
.bd-ok{fill:var(--good);fill-opacity:.10}.bd-atencao{fill:var(--warn);fill-opacity:.16}.bd-alerta{fill:var(--serious);fill-opacity:.16}.bd-risco{fill:var(--critical);fill-opacity:.14}
.radar{margin-top:10px}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}.rd-spoke{stroke:var(--line);stroke-width:1}
.rd-lab{fill:var(--muted);font-size:11px;font-weight:700;font-family:var(--body)}.rd-tk{fill:var(--muted);font-size:9px;font-family:var(--body)}
.rd-refin{fill:var(--rdref);fill-opacity:.16;stroke:var(--rdref);stroke-width:1.2;stroke-dasharray:4 3}
.rd-refring{fill:var(--good);fill-opacity:.09;fill-rule:evenodd}
.rd-refline{fill:none;stroke:var(--rdref);stroke-width:1.2;stroke-dasharray:4 3}
.rd-s{fill:none;stroke-width:1.8;stroke-linejoin:round}.rd-s.last{stroke-width:2.5;fill-opacity:.2}.rd-s:not(.last){fill:none}
.rd-c1{stroke:var(--rd1);fill:var(--rd1)}.rd-c2{stroke:var(--rd2);fill:var(--rd2)}.rd-c3{stroke:var(--rd3);fill:var(--rd3)}.rd-c4{stroke:var(--rd4);fill:var(--rd4)}
.rd-dot{stroke:var(--surface);stroke-width:2}
.rlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px;justify-content:center}
.rlegend span{display:inline-flex;gap:6px;align-items:center}
.rlegend i{width:22px;height:0;border-top:3px solid;display:inline-block}
.rlegend i.fill{height:12px;border:2.5px solid;border-radius:3px}
.rlegend i.ref{border-top:2px dashed var(--rdref)}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dchips button{min-height:36px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600;cursor:pointer}
.dchips button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.scrollx{overflow-x:auto}
table.dq{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
table.dq th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dq td{padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.dq tr.mg td{font-weight:700;background:var(--soft)}
/* tasks */
canvas.trace{display:block;width:100%;aspect-ratio:3/2;touch-action:none;background:var(--surface)}
.react{height:280px;display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.react .stim{width:140px;height:140px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff}
.react .go{background:#2E7D5B;border-radius:50%}
.react .nogo{background:#A83A3A;border-radius:18px}
.react .msg{font-size:18px;color:var(--muted);text-align:center;padding:0 20px}
/* roda */
.rcards{display:grid;gap:8px}
.rcol{background:var(--soft);border-radius:14px;padding:10px;display:grid;gap:8px}
.rcol-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:16px}
.rcol-h .sw{width:14px;height:14px;border-radius:4px}
.rcol-h .ct{margin-left:auto;font-family:var(--body);font-size:13px;color:var(--muted)}
.acard{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.acard-h{display:flex;align-items:center;gap:8px}
.acard-h .em{font-size:22px;line-height:1}
.acard-h .nm{font-weight:700;font-size:15px;flex:1;line-height:1.25}
.star{min-height:36px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:0 10px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.star[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.star:disabled{opacity:.35;cursor:not-allowed}
.lvseg{display:flex;gap:4px;flex-wrap:wrap}
.lvseg button{flex:1 1 0;min-width:0;min-height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 6px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvseg button[data-lv="0"][aria-pressed="true"]{background:var(--lv0);color:var(--lv0-ink);border-color:transparent}
.lvseg button[data-lv="1"][aria-pressed="true"]{background:var(--lv1);color:var(--lv1-ink);border-color:transparent}
.lvseg button[data-lv="2"][aria-pressed="true"]{background:var(--lv2);color:var(--lv2-ink);border-color:transparent}
.lvseg button[data-lv="na"]{flex:0 0 auto;color:var(--muted)}
.lvseg button[data-lv="na"][aria-pressed="true"]{background:var(--na);color:var(--ink)}
.faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 8px 10px;display:grid;justify-items:center;gap:8px;text-align:center}
.fcard.lv0{background:color-mix(in srgb,var(--lv0) 45%,var(--surface))}.fcard.lv1{background:color-mix(in srgb,var(--lv1) 45%,var(--surface))}.fcard.lv2{background:color-mix(in srgb,var(--lv2) 40%,var(--surface))}
.fcard .big{font-size:42px;line-height:1}
.fcard .nm{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2}
.fbtns{display:flex;gap:6px}
.fbtns button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.fbtns button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.frow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.frow button{min-height:36px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;cursor:pointer}
.frow button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.frow button:disabled{opacity:.4}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{display:inline-flex;align-items:center;gap:7px;min-height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;font-weight:600;font-size:14px;cursor:pointer}
.role[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.role .lbl{color:var(--ink)}
.role .prog{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}
.c-familia{color:var(--r-familia)}.c-escola{color:var(--r-escola)}.c-terapeuta{color:var(--r-terapeuta)}.c-crianca{color:var(--r-crianca)}
.b-familia{background:var(--r-familia)}.b-escola{background:var(--r-escola)}.b-terapeuta{background:var(--r-terapeuta)}.b-crianca{background:var(--r-crianca)}
.prio{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start}
.rank{font-family:var(--display);font-weight:800;font-size:20px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.prio textarea{grid-column:2;min-height:56px}

const I={
 idadi:{n:'IDADI',full:'Inventário Dimensional de Avaliação do Desenvolvimento Infantil',idade:[4,72],inf:'Pais (autoaplicado ou entrevista)',area:'Desenvolvimento global',

 esdm:{n:'Checklist Denver',full:'Checklist do currículo do Modelo Denver (ESDM)',idade:[12,72],inf:'Observação e relato da família',area:'Desenvolvimento global',idx:true,

 ps2:{n:'Perfil Sensorial 2',full:'Perfil Sensorial 2 (Winnie Dunn)',idade:[0,179],inf:'Cuidador; versão escolar pelo professor',area:'Processamento sensorial',

 pedicat:{n:'PEDI-CAT',full:'Inventário de Avaliação Pediátrica de Incapacidade – versão computadorizada',idade:[0,251],inf:'Pais (entrevista)',area:'Funcionalidade',

 mabc2:{n:'MABC-2',full:'Movement Assessment Battery for Children – 2',idade:[36,203],inf:'Teste aplicado à criança',area:'Coordenação motora',

    if(P.chave==='doc'){const d=await pacDoc(P.pid);return snapOf(P.pid,d)}
    await loadPid(P.pid);const e=store[P.pid].docs.get(P.chave);return snapOf(P.chave.split('/').pop(),e?e.data:null)}
  await loadPid(P.pid);const out=[];store[P.pid].docs.forEach((v,k)=>{if(k.startsWith(P.sub+'/'))out.push({id:k.slice(P.sub.length+1),data:()=>v.data})});
  if(l.order)out.sort((a,b)=>String(a.data()[l.order]||'').localeCompare(String(b.data()[l.order]||'')));

async function emit(l){try{const sn=await buildSnap(l);if(!l.off)l.cb(sn)}catch(e){if(!l.off&&l.err)l.err(e)}}
function notify(pid){listeners.forEach(l=>{const P=parsePath(l.path);if(P.kind==='pacientes'||P.pid===pid)emit(l)})}
function listen(path,cb,err,order){const l={path,cb,err,order,off:false};listeners.push(l);emit(l);return()=>{l.off=true;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}
async function putDoc(path,data,merge){const P=parsePath(path);await loadPid(P.pid);
  const st=store[P.pid];const cur=st.docs.get(P.chave);
  const nd=merge?Object.assign({},cur?cur.data:{},data):data;
  const entry=cur||{rowId:null,data:nd};const antes=cur?cur.data:undefined;entry.data=nd;st.docs.set(P.chave,entry);
  const json=JSON.stringify(nd);
  try{
    if(entry.rowId)await api('atualizar',{tabela:'evolucoes',id:entry.rowId,dados:{infantil:json}});
    else{const r=await api('salvar',{tabela:'evolucoes',dados:{paciente_id:P.pid,data:hojeISO(),texto:'Avaliação infantil (registro interno)',autor_email:S.user.email,autor_nome:S.user.nome,origem:'infantil',chave:P.chave,infantil:json}});entry.rowId=r.id}
  }catch(e){if(cur)cur.data=antes;else st.docs.delete(P.chave);throw e}

  doc:path=>({set:d=>putDoc(path,d,false),update:d=>putDoc(path,d,true),delete:()=>delDoc(path),onSnapshot:(cb,err)=>listen(path,cb,err)}),
  collection:path=>{const c={o:null,orderBy(k){c.o=k;return c},onSnapshot:(cb,err)=>listen(path,cb,err,c.o),get:()=>buildSnap({path,order:c.o})};return c}

function apoioTick(){if(!T.run)return;T.el=Math.min(30,(performance.now()-T.t0)/1000);const b=$('#tBig');if(b)b.textContent=fmt(T.el,1)+' s';if(T.el>=30){apoioStop();return}T.raf=requestAnimationFrame(apoioTick)}

/* traçado */
function shapePts(){const p=[];const S=UI.trShape;
 if(S==='onda'){for(let i=0;i<=400;i++){const x=90+i*(720/400);p.push([x,300+120*Math.sin(i/400*Math.PI*4)])}}
 else if(S==='zigue'){const xs=[90,210,330,450,570,690,810];xs.forEach((x,i)=>{if(i){const[x0,y0]=p[p.length-1];const y1=i%2?160:440;for(let j=1;j<=60;j++)p.push([x0+(x-x0)*j/60,y0+(y1-y0)*j/60])}else p.push([x,440])})}
 else{for(let i=0;i<=400;i++){const a=-Math.PI/2+i/400*Math.PI*2;p.push([450+200*Math.cos(a),300+200*Math.sin(a)])}}
 return p}
function trDraw(){const cv=$('#trCv');if(!cv)return;const c=cv.getContext('2d');const cs=getComputedStyle(document.documentElement);
 c.clearRect(0,0,900,600);const tp=shapePts();
 c.lineWidth=14;c.lineCap='round';c.lineJoin='round';c.strokeStyle=cs.getPropertyValue('--soft').trim()||'#DDE9E3';c.setLineDash([]);
 c.beginPath();tp.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
 c.lineWidth=3;c.strokeStyle=cs.getPropertyValue('--muted').trim()||'#55645E';c.setLineDash([10,10]);c.beginPath();tp.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();c.setLineDash([]);
 c.fillStyle='#2E7D5B';c.beginPath();c.arc(tp[0][0],tp[0][1],12,0,Math.PI*2);c.fill();
 c.strokeStyle=cs.getPropertyValue('--live').trim()||'#C9831F';c.lineWidth=5;
 T.strokes.forEach(s=>{c.beginPath();s.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()});
}
function trMetrics(){const tp=shapePts();const all=T.strokes.flat();if(all.length<5)return null;const cv=$('#trCv');const scale=cv.getBoundingClientRect().width/900;
 let sum=0;all.forEach(([x,y])=>{let m=1e9;for(const[a,b]of tp){const d=(a-x)**2+(b-y)**2;if(d<m)m=d}sum+=Math.sqrt(m)});
 const mean=sum/all.length;const mm=mean*scale*0.2646;
 let cov=0;tp.forEach(([a,b])=>{if(all.some(([x,y])=>(a-x)**2+(b-y)**2<40*40))cov++});
 return{mm:Math.round(mm*10)/10,cov:Math.round(cov/tp.length*100),t:T.trT1&&T.trT0?(T.trT1-T.trT0)/1000:null}}
function trShow(){const r=trMetrics();if(!$('#trDev'))return;$('#trDev').textContent=r?fmt(r.mm,1):'–';$('#trCov').textContent=r?r.cov+'%':'–';$('#trTime').textContent=r&&r.t?fmt(r.t,1)+' s':'–'}
function afterTask(){if(UI.task==='traco'){trDraw();trShow();const cv=$('#trCv');let cur=null;
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*900,(e.clientY-r.top)/r.height*600]};
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);cur=[pos(e)];T.strokes.push(cur);if(!T.trT0)T.trT0=performance.now();trDraw()});
 cv.addEventListener('pointermove',e=>{if(!cur)return;cur.push(pos(e));T.trT1=performance.now();trDraw()});
 const up=()=>{if(cur){cur=null;trShow()}};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}}

function pt(cx,cy,r,a){const t=a*Math.PI/180;return[cx+r*Math.sin(t),cy-r*Math.cos(t)]}
function wedge(cx,cy,r0,r1,a0,a1){const L=a1-a0>180?1:0;const p1=pt(cx,cy,r1,a0),p2=pt(cx,cy,r1,a1),p3=pt(cx,cy,r0,a1),p4=pt(cx,cy,r0,a0);const f=n=>n.toFixed(1);
 return`M${f(p1[0])} ${f(p1[1])}A${r1} ${r1} 0 ${L} 1 ${f(p2[0])} ${f(p2[1])}L${f(p3[0])} ${f(p3[1])}A${r0} ${r0} 0 ${L} 0 ${f(p4[0])} ${f(p4[1])}Z`}
function rodaSVG(){const W=440,cx=220,cy=220,R0=48,st=34,n=AREAS.length,span=360/n,gap=1.2,cid=centralId();let s='',mk='',lb='';
 AREAS.forEach((a,i)=>{const a0=i*span+gap,a1=(i+1)*span-gap;
  ROLE_IDS.forEach((r,k)=>{const X=RR(r);const lv=X.areas[a.id];const cls=lv===undefined?'lvx':lv==='na'?'lvna':'lv'+lv;const r0=R0+k*st;
   s+=`<path class="seg-path ${cls}" d="${wedge(cx,cy,r0,r0+st,a0,a1)}" data-a="rarea" data-id="${a.id}"><title>${esc(roleName(r))} · ${esc(a.adult)}: ${lv===undefined?'sem resposta':lv==='na'?'não observa':LVNAME[lv]}</title></path>`;
   const pi=X.prio.indexOf(a.id);if(pi>=0){const p=pt(cx,cy,r0+st/2,(a0+a1)/2);mk+=`<circle class="pr" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="7"/><text class="prt" x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}">${pi+1}</text>`}});
  const lp=pt(cx,cy,R0+4*st+18,(i+.5)*span);lb+=`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" font-size="20" text-anchor="middle" dominant-baseline="central" data-a="rarea" data-id="${a.id}" style="cursor:pointer">${a.em}<title>${esc(a.adult)}</title></text>`});
 const out=R0+4*st;let hl='';
 if(cid){const i=AREAS.findIndex(a=>a.id===cid);hl+=`<path class="hl" d="${wedge(cx,cy,R0,out,i*span+.4,(i+1)*span-.4)}"/>`}
 if(UI.rhover&&UI.rhover!==cid){const i=AREAS.findIndex(a=>a.id===UI.rhover);hl+=`<path class="hov" d="${wedge(cx,cy,R0,out,i*span+.4,(i+1)*span-.4)}"/>`}
 const h=UI.rhover?AREA[UI.rhover]:null;
 const c=h?`<text x="${cx}" y="${cy-6}" font-size="22" text-anchor="middle" dominant-baseline="central">${h.em}</text><text x="${cx}" y="${cy+16}" font-size="10" font-weight="700" text-anchor="middle">${esc(h.kid.slice(0,15))}</text>`
  :`<text x="${cx}" y="${cy}" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central">${esc(cod().slice(0,10))}</text>`;
 return`<svg class="rodasvg" viewBox="0 0 ${W} ${W}" role="img" aria-label="Roda com as respostas de cada pessoa por área" style="width:100%;height:auto"><circle cx="${cx}" cy="${cy}" r="${R0-3}" fill="var(--soft)"/>${s}${hl}${mk}${lb}${c}</svg>`}

function commCard(r,hand){const X=CM(r);
 const secs=CSEC.map(sec=>`<div class="clist"><h4>${sec.t}</h4>${X[sec.k].map((it,i)=>sec.k==='preciso'

  <div class="addrow"><input type="text" id="add-${r}-${sec.k}" data-enter="cadd" data-r="${r}" data-k="${sec.k}" placeholder="Escrever…" aria-label="${sec.t}">${sec.k==='preciso'?`<select id="para-${r}" aria-label="De quem">${ROLE_IDS.filter(x=>x!==r).map(x=>`<option value="${x}">${esc(roleName(x))}</option>`).join('')}</select>`:''}<button type="button" class="btn sm" data-a="cadd" data-r="${r}" data-k="${sec.k}">Adicionar</button></div></div>`).join('');
 return`<article class="ccard"><div class="ccard-h"><span class="av b-${r}">${ROLES[r].ini}</span><div style="flex:1"><h3>${esc(roleName(r))}</h3></div>${hand?`<button type="button" class="btn sm ghost" data-a="handcomm" data-v="${r}">Entregar</button>`:''}</div><div class="ccard-b">${secs}</div></article>`}
function rComp(){const cid=centralId();
 if(!cid)return`<div class="card"><p>Primeiro defina a questão central no Mapa.</p><button class="btn" data-a="rsub" data-v="mapa" type="button">Ir para o mapa</button></div>`;
 const asks=[];ROLE_IDS.forEach(r=>CM(r).preciso.forEach(it=>{if(ROLES[it.para])asks.push({from:r,to:it.para,t:it.t})}));
 return`<div class="how"><b>Questão central:</b> ${AREA[cid].em} ${esc(AREA[cid].adult)}${P.doc.rodaCentral?'':' (sugestão; confirme no Mapa)'}.<br>Cada pessoa diz o que já faz, o que pode fazer e o que precisa dos outros.</div>
 <div class="stack">${ROLE_IDS.map(r=>commCard(r,true)).join('')}</div>
 <div class="card"><h3>Mapa de compromissos</h3><p class="hint">Cada seta é um pedido; quanto mais grossa, mais pedidos.</p>${netSVG(asks)}${asks.map(x=>`<div class="ask"><span class="tg b-${x.from}">${esc(roleName(x.from))}</span>→<span class="tg b-${x.to}">${esc(roleName(x.to))}</span><span>${esc(x.t)}</span></div>`).join('')||'<p class="hint">Nenhum pedido ainda.</p>'}</div>`}
function netSVG(asks){const Pp={crianca:[260,160],familia:[80,60],escola:[440,60],terapeuta:[260,295]};const cnt={};asks.forEach(x=>{const k=x.from+'>'+x.to;cnt[k]=(cnt[k]||0)+1});let e='',b='';
 Object.entries(cnt).forEach(([k,n])=>{const[f,t]=k.split('>');const[x1,y1]=Pp[f],[x2,y2]=Pp[t];const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;const sx=x1+ux*38,sy=y1+uy*38,ex=x2-ux*44,ey=y2-uy*44,mx=(sx+ex)/2-uy*22,my=(sy+ey)/2+ux*22;
  e+=`<path class="edge" d="M${sx.toFixed(1)} ${sy.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="var(--r-${f})" stroke-width="${1.5+n*1.5}" marker-end="url(#ah-${f})"/>`;
  const bx=(sx+2*mx+ex)/4,by=(sy+2*my+ey)/4;b+=`<circle class="cntbg" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="9"/><text class="cnt" x="${bx.toFixed(1)}" y="${by.toFixed(1)}">${n}</text>`});
 const defs=ROLE_IDS.map(r=>`<marker id="ah-${r}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--r-${r})"/></marker>`).join('');
 const nodes=ROLE_IDS.map(r=>{const[x,y]=Pp[r];const nm=roleName(r);return`<circle cx="${x}" cy="${y}" r="${r==='crianca'?36:30}" fill="var(--r-${r})"/><text x="${x}" y="${y}" style="fill:#fff" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">${esc(nm.length>11?nm.slice(0,10)+'…':nm)}</text>`}).join('');
 return`<svg class="netsvg" viewBox="0 0 520 340" role="img" aria-label="Pedidos entre as pessoas da rede" style="width:100%;height:auto"><defs>${defs}</defs>${e}${nodes}${b}</svg>`}

 return`<p class="how">Cada meta tem 5 níveis; 0 é o resultado esperado em 3 meses. Escolha o momento e quem está marcando e toque no nível. Os círculos tracejados mostram de onde cada um partiu.</p>

function chart(m,pts,bands){const W=300,H=140,L=38,R=40,T=10,B=24,iw=W-L-R,ih=H-T-B,min=m.min,max=m.max;const y=v=>T+ih*(1-(Math.max(min,Math.min(max,v))-min)/(max-min));
 const t0=pts.length?new Date(pts[0].d).getTime():0,t1=pts.length?new Date(pts[pts.length-1].d).getTime():0;const x=d=>pts.length<2||t1===t0?L+iw/2:L+iw*((new Date(d).getTime()-t0)/(t1-t0));let s='';
 if(bands){let lo=min;bands.forEach(b=>{const hi=Math.min(b.hi,max);if(hi>lo)s+=`<rect class="bd-${b.l}" x="${L}" width="${iw}" y="${y(hi).toFixed(1)}" height="${(y(lo)-y(hi)).toFixed(1)}"/>`;lo=Math.max(lo,hi)})}
 let ticks=m.sel?m.sel.map(o=>o.v):[min,max];if(!m.sel&&bands)bands.forEach(b=>{if(isFinite(b.hi)&&b.hi>min&&b.hi<max)ticks.push(Math.round(b.hi))});
 const pl=[];ticks.sort((a,b)=>a-b).forEach(v=>{const yy=y(v);if(pl.every(p=>Math.abs(p-yy)>=11)){pl.push(yy);s+=`<line class="ch-grid" x1="${L}" x2="${L+iw}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="ch-tick" x="${L-6}" y="${yy.toFixed(1)}" text-anchor="end" dominant-baseline="central">${m.sel?(v>0?'+'+v:v):fmt(v)}</text>`}});
 if(pts.length>1)s+=`<path class="ch-line" d="${pts.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+' '+y(p.v).toFixed(1)).join('')}"/>`;
 pts.forEach(p=>{const cx=x(p.d).toFixed(1),cy=y(p.v).toFixed(1);s+=`<circle class="ch-hit" cx="${cx}" cy="${cy}" r="12" data-tip="${esc(p.tip)}"/><circle class="ch-pt" cx="${cx}" cy="${cy}" r="4.5" tabindex="0" data-tip="${esc(p.tip)}" aria-label="${esc(p.tip)}"/>`});
 if(pts.length){const lp=pts[pts.length-1];s+=`<text class="ch-lbl" x="${(x(lp.d)+8).toFixed(1)}" y="${y(lp.v).toFixed(1)}" dominant-baseline="central">${esc(m.sel?(lp.v>0?'+'+lp.v:String(lp.v)):fmt(lp.v))}</text><text class="ch-tick" x="${pts.length>1?L:L+iw/2}" y="${H-6}" text-anchor="${pts.length>1?'start':'middle'}">${dBR(pts[0].d,true)}</text>`;if(pts.length>1)s+=`<text class="ch-tick" x="${L+iw}" y="${H-6}" text-anchor="end">${dBR(lp.d,true)}</text>`}
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.n)}: evolução">${s}</svg>`}
function seriesFor(k,m){return(byInstr()[k]||[]).map(a=>{const v=val(m,a);if(v==null)return null;const c=classify(m,v,a,P.doc);return{d:a.data,v,tip:`${dBR(a.data)} · ${showVal(m,v)}${c?' · '+LV[c.l].t:''}`}}).filter(Boolean)}
const radarMs=k=>I[k].m.filter(m=>m.r);const radarOK=k=>radarMs(k).length>=3;
function idxOf(v,a){const age=ageM(P.doc.nasc,a.data);return age>0&&v!=null?Math.round(v/age*100):null}
function completos(k){const ms=radarMs(k);return(byInstr()[k]||[]).filter(a=>ms.every(m=>val(m,a)!=null))}
function norm(k,m,v,a){if(v==null)return null;let r;if(I[k].idx){const ix=idxOf(v,a);r=ix==null?null:ix/150}else if(m.dir==='mid')r=1-Math.abs(v)/2;else if(m.dir==='down')r=(m.max-v)/(m.max-m.min);else r=(v-m.min)/(m.max-m.min);return r==null?null:Math.max(0,Math.min(1,r))}
function refNorm(k,m,a){if(I[k].idx)return 100/150;const b=bandsOf(m,a,P.doc);if(!b)return null;if(m.dir==='mid')return .75;const i=b.findIndex(x=>x.l==='ok');if(i<0)return null;if(m.dir==='down')return norm(k,m,b[i].hi,a);const lo=i>0?b[i-1].hi:m.min;return norm(k,m,Math.round(lo),a)}
function selDates(k){const all=completos(k);if(!all.length)return[];const ids=UI.rsel[k]||all.slice(-4).map(a=>a.id);const s=all.filter(a=>ids.includes(a.id));return s.length?s:all.slice(-1)}
const rampIdx=n=>n===1?[4]:n===2?[2,4]:[1,2,3,4].slice(4-n);
function radarSVG(k,sel){const ins=I[k],ms=radarMs(k),N=ms.length,W=460,H=350,cx=230,cy=175,R=118;const ang=i=>-Math.PI/2+i*2*Math.PI/N;const p=(i,r)=>[cx+R*r*Math.cos(ang(i)),cy+R*r*Math.sin(ang(i))];
 const poly=rs=>rs.map((r,i)=>p(i,r).map(n=>n.toFixed(1)).join(' ')).join(' ');let s='';
 [.25,.5,.75,1].forEach(r=>{s+=`<polygon class="rd-grid" points="${poly(ms.map(()=>r))}"/>`});ms.forEach((m,i)=>{const[x,y]=p(i,1);s+=`<line class="rd-spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`});
 if(ins.idx)[50,100,150].forEach(v=>{const[x,y]=p(0,v/150);s+=`<text class="rd-tk" x="${(x+4).toFixed(1)}" y="${(y+3).toFixed(1)}">${v}</text>`});
 const last=sel[sel.length-1],refs=ms.map(m=>refNorm(k,m,last));
 if(refs.every(r=>r!=null)){if(ins.idx)s+=`<polygon class="rd-refin" points="${poly(refs)}"/>`;else{const tp=rs=>'M'+rs.map((r,i)=>p(i,r).map(n=>n.toFixed(1)).join(' ')).join('L')+'Z';s+=`<path class="rd-refring" d="${tp(ms.map(()=>1))}${tp(refs)}"/><polygon class="rd-refline" points="${poly(refs)}"/>`}}
 const ri=rampIdx(sel.length);sel.forEach((a,j)=>{s+=`<polygon class="rd-s rd-c${ri[j]} ${j===sel.length-1?'last':''}" points="${poly(ms.map(m=>norm(k,m,val(m,a),a)))}"/>`});
 sel.forEach((a,j)=>ms.forEach((m,i)=>{const v=val(m,a);const[x,y]=p(i,norm(k,m,v,a));const tip=`${dBR(a.data)} · ${m.n}: ${showVal(m,v)}${ins.idx?` · índice ${idxOf(v,a)}`:''}`;
  if(j===sel.length-1)s+=`<circle class="rd-dot rd-c${ri[j]}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(tip)}"/>`;s+=`<circle class="rd-hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" data-tip="${esc(tip)}"/>`}));
 ms.forEach((m,i)=>{const[x,y]=p(i,1.13);const c=Math.cos(ang(i));s+=`<text class="rd-lab" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${Math.abs(c)<.2?'middle':c>0?'start':'end'}" dominant-baseline="central">${esc(m.r)}<title>${esc(m.n)}</title></text>`});
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar de ${esc(ins.n)}">${s}</svg>`}
function radarLegend(k,sel){const ri=rampIdx(sel.length);return`<div class="rlegend">${sel.map((a,j)=>{const l=j===sel.length-1;return`<span><i class="${l?'fill':''}" style="border-color:var(--rd${ri[j]});${l?'background:color-mix(in srgb,var(--rd'+ri[j]+') 20%,transparent)':''}"></i>${dBR(a.data)}${l?' (mais recente)':''}</span>`}).join('')}<span><i class="ref"></i>${I[k].idx?'Idade real (índice 100)':'Limite do esperado'}</span></div>`}
function esdmTable(k){const arr=completos(k);if(!arr.length)return'';const a=arr[arr.length-1],prev=arr.length>1?arr[arr.length-2]:null;const A=ageM(P.doc.nasc,a.data),Pv=prev?ageM(P.doc.nasc,prev.data):null;const ms=radarMs(k);
 const row=(n,v,pv,cls)=>{const ix=A?Math.round(v/A*100):null;const rit=prev&&pv!=null&&A>Pv?Math.round((v-pv)/(A-Pv)*100):ix;return`<tr class="${cls||''}"><td>${esc(n)}</td><td>${ix??'–'}</td><td>${fmt(v)} m</td><td>${A} m</td><td>${fmt(Math.max(0,A-v))} m</td><td>${rit==null?'–':rit+'%'}</td></tr>`};
 const mn=f=>ms.reduce((s,m)=>s+val(m,f),0)/ms.length;
 return`<div class="scrollx"><table class="dq"><thead><tr><th>Esfera</th><th>Índice</th><th>Idade calc.</th><th>Idade real</th><th>Atraso</th><th>${prev?'Ritmo no período':'Ritmo'}</th></tr></thead><tbody>${row('Média geral',Math.round(mn(a)*10)/10,prev?mn(prev):null,'mg')}${ms.map(m=>row(m.n,val(m,a),prev?val(m,prev):null)).join('')}</tbody></table></div>
 <p class="hint">${prev?`Ritmo = meses ganhos ÷ meses entre ${dBR(prev.data)} e ${dBR(a.data)}. 100% é o ritmo do desenvolvimento típico.`:'Ritmo = idade calculada ÷ idade real. Com a próxima aplicação, mostra o ritmo do período.'}</p>`}

 const hist=P.avs.slice().sort((a,b)=>a.data<b.data?1:-1).map(a=>{const ins=I[a.instr];if(!ins)return'';
  return`<div class="it"><div class="l"><b>${esc(ins.n)} · ${dBR(a.data)}</b><span>${ins.m.map(m=>{const v=val(m,a);return v==null?'':esc(m.r||m.n)+': '+esc(showVal(m,v))}).filter(Boolean).join(' · ')}</span></div><div class="acts">${a.instr!=='app'&&podeApagar(a)?`<button class="mini" data-a="edit" data-id="${esc(a.id)}">Editar</button>`:''}${podeApagar(a)?`<button class="mini ${UI.armed===a.id?'armed':''}" data-a="delAv" data-id="${esc(a.id)}">${UI.armed===a.id?'Confirmar':'Excluir'}</button>`:''}</div></div>`}).join('');
 return`<div class="btns two"><button class="btn" data-a="ptOpen" type="button">Relatório para a família</button><button class="btn ghost" data-a="tcOpen" type="button">Relatório técnico</button></div>
 <p class="hint">Toque em cada instrumento para ver os gráficos. No radar, cada reavaliação se sobrepõe às anteriores: a mais recente fica escura e preenchida.</p>
 ${cards}

 if(A==='tcClose'){$('#tcView').hidden=true;$('#tcView').innerHTML='';return}
 if(A==='tcDown'){tcDown();return}
 if(A==='tcCopy'){copyText(tcText());return}
 if(A==='ptCopy'){const t=ptText();const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado')}catch(e){toast('Não foi possível copiar')}ta.remove()};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),fb)}catch(e){fb()}return}
 /* painel */
 if(A==='filtro'){UI.filtro=d.v;renderMain();return}
 if(A==='exportCSV'){exportCSV();return}
 if(A==='agendar'){agendar();return}
 if(A==='goPac'){openPac(d.id);UI.tab='proto';lsSet('ai-tab','proto');renderAll();window.scrollTo({top:0,behavior:'smooth'});return}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.matches&&t.matches('details[data-open]')){UI.open=UI.open||{};UI.open[t.dataset.open]=t.open}},true);
function cadd(r,k){if(RO){toast('Acesso só de leitura');return}const inp=document.getElementById(`add-${r}-${k}`);const t=inp.value.trim();if(!t){inp.focus();return}
 const X=CM(r);if(k==='preciso')X.preciso.push({para:document.getElementById(`para-${r}`).value,t});else X[k].push(t);saveComm(r);renderAll();const a=document.getElementById(`add-${r}-${k}`);if(a)a.focus()}
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.enter==='cadd'){e.preventDefault();cadd(t.dataset.r,t.dataset.k)}
 if((e.key==='Enter'||e.key===' ')&&t.id==='rxStage'){e.preventDefault();rxTap()}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.fv){const F=formFor(d.i);const raw=t.value;if(raw==='')delete F.v[d.fv];else F.v[d.fv]=Number(raw.replace(',','.'));const r=$('#qres-'+d.i);if(r)r.innerHTML=resultHTML(d.i);return}
 if(d.fo){formFor(d.fo).obs=t.value;return}
 if(d.nota){if(RO)return;RR(d.nota).notas[d.id]=t.value;rdeb('nota-'+d.nota,()=>saveResp(d.nota),800);return}
 if(t.id==='ptMsg'||t.id==='ptPlano'){if(RO)return;const k=t.id==='ptMsg'?'comentario':'plano';P.doc[k]=t.value;rdeb('pt-'+k,()=>patchPac({[k]:P.doc[k]}),900);$('#ptPaper').innerHTML=ptHTML();return}
 if(t.id==='ptN'||t.id==='ptR'){lsSet('ai-aval',{n:$('#ptN').value,r:$('#ptR').value});if($('#ptPaper'))$('#ptPaper').innerHTML=ptHTML();if($('#tcPaper'))$('#tcPaper').innerHTML=tcHTML();return}
 if(t.id==='tcMot'||t.id==='tcCon'||t.id==='tcNome'){if(RO)return;const k={tcMot:'tecMotivo',tcCon:'tecConduta',tcNome:'tecNome'}[t.id];P.doc[k]=t.value;rdeb('tc-'+k,()=>patchPac({[k]:P.doc[k]}),900);$('#tcPaper').innerHTML=tcHTML();return}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id==='pSel'){stopTasks();openPac(t.value);return}
 if(t.id==='iSel'){UI.sel[d.cat]=t.value;renderMain();return}
 if(d.fd){formFor(d.fd).data=t.value;renderMain();return}
 if(d.fi){formFor(d.fi).inf=t.value;const r=$('#qres-'+d.fi);if(r)r.innerHTML=resultHTML(d.fi);return}
 if(t.id==='tcDest'){if(RO)return;patchPac({tecDest:t.value});$('#tcPaper').innerHTML=tcHTML();return}
 if(t.id==='rcSel'){UI.rhover=t.value;renderMain();return}
 if(d.cons){if(RO){t.checked=!t.checked;toast('Acesso só de leitura');return}const c=Object.assign({},P.doc.consent||{});c[d.cons]=t.checked?today():null;patchPac({consent:c});renderAll();return}
 if(['pdNasc','pdResp','pdReav'].includes(t.id)){if(RO)return;const k={pdNasc:'nasc',pdResp:'resp',pdReav:'reavaliar'}[t.id];let v=t.value.trim();if(k==='reavaliar')v=Number(v);if(k==='codigo'&&!v){toast('O código não pode ficar vazio');return}patchPac({[k]:v});if(OFFLINE)syncResumo();renderAll();return}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='pNewF'){novoPac();return}
 if(f.id==='goalF'){if(RO){toast('Acesso só de leitura');return}const t=$('#gT').value.trim();if(!t){$('#gT').focus();toast('Escreva a meta');return}
  const niveis=GAS_VALS.map((v,i)=>$('#gN'+i).value.trim()||['Muito abaixo do esperado','Abaixo do esperado','Resultado esperado','Acima do esperado','Muito acima do esperado'][i]);
  const g={id:newId('m'),titulo:t,niveis,marcas:{T0:{},T1:{}},criado:new Date().toISOString()};P.metas.push(g);const b2=clone(g);delete b2.id;W(`pacientes/${P.id}/metas/${g.id}`,b2);UI.tp='T0';renderMain();toast('Meta adicionada')}
});
async function delAv(a,btn){
 const pid=P.id,path=`pacientes/${pid}/avaliacoes/${a.id}`;
 if(btn){btn.disabled=true;btn.textContent='Excluindo…'}
 const ok=await chainOk(path,()=>DB.doc(path).delete());
 if(!ok){toast('Não excluiu. Tente de novo.');if(btn){btn.disabled=false;btn.textContent='Excluir'}return}
 if(a.evoId){try{await api('deletar',{tabela:'evolucoes',id:a.evoId})}catch(e){toast('Excluí a avaliação, mas a evolução no prontuário continua. Apague-a por lá.')}}
 if(P&&P.id===pid){P.avs=P.avs.filter(x=>x.id!==a.id);renderMain();syncResumo()}
 toast('Registro excluído do prontuário');
}
function stopTasks(){if(T.run){T.run=false;cancelAnimationFrame(T.raf)}clearTimeout(T.rxTo);if(T.rx&&!T.rx.done)T.rx=null}

/* tooltip */
const tip=$('#tip');function showTip(el,x,y){tip.textContent=el.dataset.tip;tip.classList.add('on');const r=tip.getBoundingClientRect();let L=x+12,Tp=y-r.height-10;if(L+r.width>innerWidth-8)L=x-r.width-12;if(Tp<8)Tp=y+14;tip.style.left=L+'px';tip.style.top=Tp+'px'}
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY)});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))tip.classList.remove('on')});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',()=>tip.classList.remove('on'));

renderAll();
(async()=>{
 DL=DLX;
 if(!logado){OFFLINE=true;RO=true;PACS=[];$('#pBox').innerHTML='<p class="err">Para usar a avaliação infantil, entre no sistema primeiro. <a href="../" style="color:inherit;font-weight:600">Entrar no sistema</a></p>';$('#tabs').innerHTML='';$('#main').innerHTML='';$('#foot').textContent='';return}
 DB=DBX;
 DB.doc('config/faixas').onSnapshot(s=>{if(s.exists){const x=s.data();if(x&&x.idadi&&x.pedicat){CFG=clone(x);if(P&&P.doc)syncResumo();renderMain()}}},()=>{});
 DB.collection('pacientes').onSnapshot(s=>{PACS=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));
  renderPatient();if(UI.tab==='painel')renderMain()},e=>{onErr(e);if(!e||e.code!=='sessao')toast('Não foi possível carregar os pacientes.')});
})();
})();
