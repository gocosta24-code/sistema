<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casa Oliveira</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface2: #f3f0eb;
  --border: #e8e2d9;
  --ink: #1c1a17;
  --ink2: #6b6560;
  --ink3: #a09890;
  --teal: #1d6b58;
  --teal-lt: #e8f4f0;
  --amber: #c4600a;
  --amber-lt: #fef3e8;
  --rose: #b81a3a;
  --rose-lt: #fde8ee;
  --violet: #5b21b6;
  --violet-lt: #ede8fd;
  --sky: #1355a0;
  --sky-lt: #e8eeff;
  --gold: #92700a;
  --gold-lt: #fdf6dc;
  --sage: #3d6b3a;
  --sage-lt: #eaf4e8;
  --r: 14px; --r-sm: 8px; --r-lg: 20px;
  --sh: 0 1px 4px rgba(28,26,23,.06), 0 4px 16px rgba(28,26,23,.06);
  --sh-lg: 0 4px 24px rgba(28,26,23,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}
button,input,select,textarea{font-family:'DM Sans',sans-serif;}
button{cursor:pointer;border:none;outline:none;}
input,select,textarea{outline:none;}

/* ── LOADING ── */
#splash{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{font-family:'Fraunces',serif;font-size:48px;color:#faf8f5;letter-spacing:-1px;}
.splash-sub{font-size:12px;color:#666;letter-spacing:3px;text-transform:uppercase;margin-top:6px;}
.splash-spin{width:28px;height:28px;border:2px solid #333;border-top-color:#faf8f5;border-radius:50%;animation:spin .7s linear infinite;margin-top:32px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#loginScreen{display:none;min-height:100vh;background:var(--ink);align-items:center;justify-content:center;padding:24px;flex-direction:column;}
.login-logo{font-family:'Fraunces',serif;font-size:52px;color:#faf8f5;text-align:center;letter-spacing:-1px;}
.login-tagline{font-size:11px;color:#555;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-top:4px;margin-bottom:40px;}
.login-card{width:100%;max-width:360px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-lg);padding:28px 24px;}
.lf{margin-bottom:16px;}
.lf label{display:block;font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.lf input{width:100%;padding:13px 15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);color:#faf8f5;font-size:15px;}
.lf input::placeholder{color:#444;}
.lf input:focus{border-color:#2d9175;}
.login-btn{width:100%;padding:15px;background:var(--teal);color:#faf8f5;border-radius:var(--r-sm);font-size:15px;font-weight:600;margin-top:6px;transition:background .2s;}
.login-btn:active{background:#155a47;}
.login-error{background:rgba(184,26,58,.15);border:1px solid rgba(184,26,58,.3);border-radius:6px;padding:9px 13px;font-size:13px;color:#f88;margin-bottom:14px;display:none;}
.demo-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.demo-pill{padding:6px 14px;border:1px solid rgba(255,255,255,.12);border-radius:20px;font-size:12px;color:#888;cursor:pointer;transition:all .2s;}
.demo-pill:hover{border-color:#2d9175;color:#2d9175;}

/* ── APP ── */
#app{display:none;min-height:100vh;padding-bottom:72px;}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:200;height:56px;background:rgba(250,248,245,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;backdrop-filter:blur(12px);}
.topbar-logo{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);letter-spacing:-.5px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-role{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;}
.tb-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;background:var(--surface2);border:1px solid var(--border);position:relative;transition:background .15s;}
.tb-btn:active{background:var(--border);}
.tb-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--rose);border-radius:50%;border:1.5px solid var(--bg);}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(250,248,245,.96);border-top:1px solid var(--border);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));backdrop-filter:blur(16px);}
.bnt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;cursor:pointer;color:var(--ink3);font-size:10px;font-weight:500;letter-spacing:.2px;position:relative;transition:color .15s;}
.bnt.active{color:var(--teal);}
.bnt-icon{font-size:20px;line-height:1;}
.bnt-bar{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:var(--teal);display:none;border-radius:0 0 3px 3px;}
.bnt.active .bnt-bar{display:block;}
.bnt-badge{position:absolute;top:3px;right:calc(50% - 18px);width:7px;height:7px;background:var(--rose);border-radius:50%;border:1.5px solid var(--bg);}

/* PAGES */
.page{display:none;padding:18px 18px 0;animation:pi .22s ease;}
.page.active{display:block;}
@keyframes pi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ph{margin-bottom:18px;}
.ph-title{font-family:'Fraunces',serif;font-size:30px;color:var(--ink);letter-spacing:-.5px;}
.ph-sub{font-size:13px;color:var(--ink3);margin-top:3px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh);}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink2);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.ct-bar{width:3px;height:14px;border-radius:2px;flex-shrink:0;}

/* STATS */
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
.stat:active{box-shadow:var(--sh-lg);}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;}
.stat.teal::before{background:var(--teal);}
.stat.amber::before{background:var(--amber);}
.stat.violet::before{background:var(--violet);}
.stat.sky::before{background:var(--sky);}
.stat.rose::before{background:var(--rose);}
.stat.sage::before{background:var(--sage);}
.stat-e{font-size:22px;margin-bottom:8px;}
.stat-n{font-family:'Fraunces',serif;font-size:32px;line-height:1;}
.stat-l{font-size:11px;color:var(--ink3);margin-top:3px;font-weight:500;}
.stat-d{font-size:11px;font-weight:600;margin-top:4px;}
.up{color:var(--teal);} .warn{color:var(--amber);} .dn{color:var(--rose);}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.ch-teal{background:var(--teal-lt);color:var(--teal);}
.ch-amber{background:var(--amber-lt);color:var(--amber);}
.ch-rose{background:var(--rose-lt);color:var(--rose);}
.ch-violet{background:var(--violet-lt);color:var(--violet);}
.ch-sky{background:var(--sky-lt);color:var(--sky);}
.ch-gold{background:var(--gold-lt);color:var(--gold);}
.ch-sage{background:var(--sage-lt);color:var(--sage);}
.ch-gray{background:var(--surface2);color:var(--ink3);}

/* ALERT STRIP */
.astrip{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;}
.astrip.critical{background:var(--rose-lt);border:1px solid #f5b0c0;}
.astrip.warn{background:var(--amber-lt);border:1px solid #f5d5b0;}
.astrip.info{background:var(--sky-lt);border:1px solid #b0c8f5;}
.astrip-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.astrip-title{font-size:13px;font-weight:600;color:var(--ink);}
.astrip-meta{font-size:11px;color:var(--ink3);margin-top:2px;}

/* TIMELINE */
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative;}
.tl-item::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--border);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.tl-dot.done{background:var(--teal);}
.tl-dot.soon{background:var(--amber);}
.tl-dot.future{background:var(--sky);}
.tl-title{font-size:13px;font-weight:600;color:var(--ink);}
.tl-meta{font-size:11px;color:var(--ink3);margin-top:1px;}

/* PATIENT CARDS */
.pc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s;}
.pc:active{box-shadow:var(--sh-lg);}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.pc-name{font-size:15px;font-weight:600;color:var(--ink);}
.pc-meta{font-size:12px;color:var(--ink3);margin-top:2px;}
.pc-prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:3px;}
.pbar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.pfill{height:100%;border-radius:2px;}
.pteal{background:var(--teal);} .pamber{background:var(--amber);} .pviolet{background:var(--violet);}
.pc-chips{display:flex;gap:5px;flex-wrap:wrap;}

/* SHEET */
.soverlay{position:fixed;inset:0;background:rgba(28,26,23,.5);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(3px);}
.soverlay.open{display:flex;animation:oi .2s ease;}
@keyframes oi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-height:94vh;overflow-y:auto;animation:su .3s cubic-bezier(.32,.72,0,1);}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
.sheet-hd{padding:18px 18px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.sheet-title{font-family:'Fraunces',serif;font-size:26px;letter-spacing:-.5px;}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink3);cursor:pointer;flex-shrink:0;margin-top:4px;}
.sheet-body{padding:18px;}

/* TABS */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:18px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 15px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--ink3);cursor:pointer;border:1px solid var(--border);transition:all .15s;}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}

/* FORM */
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.fi,.fs,.ft{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);font-size:14px;transition:border-color .15s;}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--teal);}
.ft{resize:vertical;min-height:72px;line-height:1.5;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fa{grid-column:1/-1;}

/* CHECKLIST */
.crow{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;cursor:pointer;transition:border-color .15s;}
.crow:active{border-color:var(--teal);}
.cbox{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;}
.cbox.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.ctxt{flex:1;font-size:14px;}
.crow.done .ctxt{color:var(--ink3);text-decoration:line-through;}
.cst{font-size:11px;font-weight:600;}
.cst.ok{color:var(--teal);} .cst.pend{color:var(--amber);}

/* PTS BLOCK */
.pts-b{border-left:3px solid var(--teal);background:var(--teal-lt);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;margin-bottom:10px;}
.pts-b.amber{border-color:var(--amber);background:var(--amber-lt);}
.pts-b.violet{border-color:var(--violet);background:var(--violet-lt);}
.pts-b.rose{border-color:var(--rose);background:var(--rose-lt);}
.pts-bl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:6px;}
.pts-b.amber .pts-bl{color:var(--amber);}
.pts-b.violet .pts-bl{color:var(--violet);}
.pts-b.rose .pts-bl{color:var(--rose);}

/* PTS VERSION HISTORY */
.pts-ver{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;}
.pts-ver-badge{font-family:'Fraunces',serif;font-size:16px;color:var(--ink2);min-width:40px;}
.pts-ver-info{flex:1;}
.pts-ver-date{font-size:12px;color:var(--ink3);}
.pts-ver-status{font-size:11px;font-weight:600;}

/* SAVE BTN */
.savebtn{width:100%;padding:15px;background:var(--teal);color:#fff;border-radius:var(--r-sm);font-size:15px;font-weight:700;box-shadow:0 4px 20px rgba(29,107,88,.25);transition:background .15s;margin-top:6px;}
.savebtn:active{background:#155a47;}

/* ADD BTN */
.addbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--teal);color:#fff;border-radius:20px;font-size:13px;font-weight:600;transition:background .15s;}
.addbtn:active{background:#155a47;}

/* LINES PAGE */
.line-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:14px;transition:box-shadow .15s;}
.line-card:active{box-shadow:var(--sh-lg);}
.line-emoji{font-size:28px;flex-shrink:0;}
.line-info{flex:1;}
.line-name{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);}
.line-services{font-size:12px;color:var(--ink3);margin-top:2px;}
.line-stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.line-arrow{color:var(--ink3);font-size:18px;}

/* PROFISSIONAIS */
.prof-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);}
.prof-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;}
.prof-nm{font-size:14px;font-weight:600;}
.prof-rl{font-size:12px;color:var(--ink3);margin-top:1px;}

/* INVITE CARD */
.invite-card{background:var(--teal-lt);border:1px solid #b0ddd5;border-radius:var(--r);padding:18px;margin-bottom:14px;}
.invite-title{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:14px;}

/* FINANCEIRO */
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.fin-row:last-child{border-bottom:none;}
.fin-lbl{font-size:14px;color:var(--ink2);}
.fin-val{font-size:14px;font-weight:700;}
.fin-val.green{color:var(--teal);} .fin-val.red{color:var(--rose);} .fin-val.big{font-family:'Fraunces',serif;font-size:22px;}

.scen{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;border-left:4px solid var(--border);}
.scen.curr{border-left-color:var(--teal);}
.scen.good{border-left-color:var(--sky);}
.scen.warn2{border-left-color:var(--amber);}
.scen-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:6px;}
.scen-val{font-family:'Fraunces',serif;font-size:26px;}
.scen-meta{font-size:12px;color:var(--ink3);margin-top:3px;}

/* DESKTOP */
@media(min-width:768px){
  #app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;padding-bottom:0;min-height:100vh;}
  .topbar{grid-column:1/-1;}
  .bnav{display:none;}
  .sidebar{display:flex!important;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;}
  .page,.sheet-body{padding:28px;}
  .stats2{grid-template-columns:repeat(4,1fr);}
  .patient-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .patient-grid .pc{margin-bottom:0;}
  .soverlay.open{align-items:center;}
  .sheet{max-width:580px;margin:auto;border-radius:var(--r-lg);}
}
.sidebar{display:none;}
.sd-logo{font-family:'Fraunces',serif;font-size:20px;padding:16px 18px 14px;border-bottom:1px solid var(--border);}
.sd-sec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;padding:10px 18px 3px;}
.sd-item{display:flex;align-items:center;gap:9px;padding:11px 18px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500;border-left:3px solid transparent;transition:all .15s;}
.sd-item:hover{background:var(--surface2);}
.sd-item.active{color:var(--teal);background:var(--teal-lt);border-left-color:var(--teal);}
.sd-icon{font-size:17px;width:20px;text-align:center;}

/* TOAST */
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--ink);color:#faf8f5;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:9990;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--teal);}
.toast.err{background:var(--rose);}

/* USER MENU */
.umenu-item{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;transition:background .15s;}
.umenu-item:last-child{border-bottom:none;}
.umenu-item:active{background:var(--surface2);}
.umenu-item.danger{color:var(--rose);}
.umenu-icon{font-size:18px;width:24px;text-align:center;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">Casa Oliveira</div>
  <div class="splash-sub">Sistema Clínico</div>
  <div class="splash-spin"></div>
</div>

<div id="loginScreen">
  <div class="login-logo">Casa Oliveira</div>
  <div class="login-tagline">Sistema Clínico</div>
  <div class="login-card">
    <div id="loginErr" class="login-error"></div>
    <div class="lf"><label>E-mail</label><input id="lEmail" type="email" placeholder="seu@email.com"></div>
    <div class="lf"><label>Senha</label><input id="lPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Entrar →</button>
  </div>
  <div class="demo-row">
    <div class="demo-pill" onclick="demoLogin('admin')">👑 Gestora</div>
    <div class="demo-pill" onclick="demoLogin('coordenador')">📋 Coordenadora</div>
    <div class="demo-pill" onclick="demoLogin('profissional')">👩‍⚕️ Profissional</div>
  </div>
</div>

<div id="app">

const SB = {
  headers(auth=true) {
    const h = {'Content-Type':'application/json','apikey':SB_KEY};
    if(auth && sbToken) h['Authorization'] = 'Bearer '+sbToken;
    return h;
  },
  async signIn(email, pass) {
    try {
      const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
        method:'POST', headers:this.headers(false),
        body:JSON.stringify({email,password:pass})
      });
      const d = await r.json();
      if(!r.ok) return {error: d.error_description||'Credenciais inválidas'};
      sbToken = d.access_token;
      localStorage.setItem('co_token', sbToken);
      return {data:d};
    } catch(e) { return {error:'Erro de rede: '+e.message}; }
  },
  async signOut() {
    try { await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:this.headers()}); } catch(e){}
    sbToken=null; localStorage.removeItem('co_token');
  },
  async query(table, params='') {
    try {
      const r = await fetch(SB_URL+'/rest/v1/'+table+'?'+params, {headers:this.headers()});
      if(!r.ok){ console.error('SB.query error:', table, await r.text()); return []; }
      return await r.json();
    } catch(e){ console.error('SB.query exception:', e); return []; }
  },
  async insert(table, body) {
    try {
      const r = await fetch(SB_URL+'/rest/v1/'+table, {
        method:'POST',
        headers:{...this.headers(),'Prefer':'return=representation'},
        body:JSON.stringify(body)
      });
      const d = await r.json();
      if(!r.ok){ console.error('SB.insert error:', table, d); return {error: d.message||d.details||JSON.stringify(d)}; }
      return {data: Array.isArray(d) ? d[0] : d};
    } catch(e){ console.error('SB.insert exception:', e); return {error:e.message}; }
  },
  async update(table, match, body) {
    try {
      const r = await fetch(SB_URL+'/rest/v1/'+table+'?'+match, {
        method:'PATCH',
        headers:{...this.headers(),'Prefer':'return=representation'},
        body:JSON.stringify(body)
      });
      const d = await r.json();
      if(!r.ok){ console.error('SB.update error:', table, d); return {error: d.message||JSON.stringify(d)}; }
      return {data:d};
    } catch(e){ console.error('SB.update exception:', e); return {error:e.message}; }
  },
  async delete(table, match) {
    try {
      const r = await fetch(SB_URL+'/rest/v1/'+table+'?'+match, {
        method:'DELETE', headers:this.headers()
      });
      return r.ok ? {data:true} : {error: await r.text()};
    } catch(e){ return {error:e.message}; }
  }
};

function renderPC(p, linha) {
  const cl = p.cl||{};
  const done = Object.values(cl).filter(Boolean).length;
  const total = Object.keys(cl).length;
  const pct = total>0?Math.round(done/total*100):100;
  return `<div class="pc" onclick="openPaciente('${linha}',${p.id})">
    <div class="pc-top">
      <div>
        <div class="pc-name">${p.nome}</div>
        <div class="pc-meta">${p.idade} anos${p.terapeuta?' • '+p.terapeuta:''}</div>
      </div>
      <span class="chip ${pct===100?'ch-teal':pct>60?'ch-gold':'ch-amber'}">${done}/${total}</span>
    </div>
    ${p.sessoes!==undefined?`<div class="pc-prog-label"><span>Sessões</span><span>${p.sessoes}/${p.totalSessoes}</span></div>
    <div class="pbar"><div class="pfill pteal" style="width:${Math.round(p.sessoes/p.totalSessoes*100)}%"></div></div>`:''}
    <div class="pc-chips">
      ${(p.servicos||[]).map(s=>`<span class="chip ch-gray">${s}</span>`).join('')}
      ${p.status==='Ativo'?`<span class="chip ch-teal">Ativo</span>`:`<span class="chip ch-amber">${p.status}</span>`}
    </div>
  </div>`;
}

function openPaciente(linha, id) {
  const p = (MOCK.pacientes[linha]||[]).find(x=>x.id===id);
  if(!p) return;
  const cfg = LINHA_CONFIG[linha];
  document.getElementById('sheetTitle').textContent = p.nome;

  let tabs = [], bodies = {};
  if(linha==='infantil') { tabs=['📋 Checklist','🎯 PTS','🔬 Avaliações','📅 Reuniões']; bodies={0:infantilChecklist(p),1:infantilPTS(p),2:avaliacoesPanel(p),3:reunioesPanel(p)}; }
  else if(linha==='mulher') { tabs=['📋 Checklist','🎯 PTS','📆 Serviços','🔔 Pós-Alta']; bodies={0:mulherChecklist(p),1:ptsGenerico(p),2:mulherServicos(p),3:posAltaPanel(p)}; }
  else if(linha==='reabilitacao') { tabs=['📋 Checklist','🎯 PTS','🏠 Orientações','🔔 Pós-Alta']; bodies={0:reabChecklist(p),1:ptsGenerico(p),2:orientacoesPanel(p),3:posAltaPanel(p)}; }
  else if(linha==='pilates') { tabs=['📊 My Score','📋 Dados','🔗 Indicações']; bodies={0:pilatesMyScore(p),1:pilatesDados(p),2:pilatesIndicacoes(p)}; }
  else if(linha==='geriatria') { tabs=['📋 Checklist','🎯 PTS','🏠 Casa Segura','📅 Reuniões']; bodies={0:geriatriaChecklist(p),1:ptsGenerico(p),2:casaSegura(p),3:reunioesPanel(p)}; }
  else if(linha==='mental') { tabs=['📋 Checklist','🎯 PTS','🎨 Ateliê']; bodies={0:mentalChecklist(p),1:infantilPTS(p),2:ateliePanel()}; }

  document.getElementById('sheetBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <button onclick="openLinha(window._currentLinha||'${linha}')" style="background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink2);">‹ Voltar</button>
      <span style="font-size:13px;color:var(--ink3);">${(p.servicos||[]).join(' · ')}</span>
    </div>
    <div class="tabs">${tabs.map((t,i)=>`<div class="tab ${i===0?'active':''}" onclick="switchTab('pt-${i}',this)">${t}</div>`).join('')}</div>
    ${tabs.map((t,i)=>`<div id="pt-${i}" style="display:${i===0?'block':'none'}">${bodies[i]||''}<button class="savebtn" onclick="saveOk()">💾 Salvar</button></div>`).join('')}`;
  openSheet();
}

function toggleCheck(el) {
  el.classList.toggle('done');
  const box = el.querySelector('.cbox');
  const st = el.querySelector('.cst');
  const on = box.classList.toggle('on');
  box.textContent = on?'✓':'';
  st.textContent = on?'Feito':'Pendente';
  st.className = 'cst '+(on?'ok':'pend');
}

async function salvarNovoPaciente(linha) {
  const nome = document.getElementById('np_nome')?.value?.trim();
  const terapeuta = document.getElementById('np_terapeuta')?.value;
  const erro = document.getElementById('np_erro');

  // Validação
  if(!nome) { erro.textContent='Preencha o nome do paciente.'; erro.style.display='block'; return; }
  if(!terapeuta) { erro.textContent='Selecione o terapeuta responsável.'; erro.style.display='block'; return; }
  erro.style.display='none';

  const nasc    = document.getElementById('np_nasc')?.value || null;
  const tel     = document.getElementById('np_tel')?.value?.trim() || null;
  const resp    = document.getElementById('np_resp')?.value?.trim() || null;
  const escola  = document.getElementById('np_escola')?.value?.trim() || null;
  const obs     = document.getElementById('np_obs')?.value?.trim() || null;
  const servicos = [...(document.getElementById('np_servicos')?.querySelectorAll('input:checked')||[])].map(x=>x.value);

  const btn = document.querySelector('.savebtn');
  btn.textContent = 'Cadastrando...';
  btn.disabled = true;

  // Calcular idade a partir da data de nascimento
  let idade = null;
  if(nasc) {
    const diff = Date.now() - new Date(nasc).getTime();
    idade = Math.floor(diff / (1000*60*60*24*365.25));
  }

  const paciente = {
    nome, linha,
    data_nascimento: nasc || null,
    telefone: tel || null,
    responsavel: resp || null,
    escola: escola || null,
    servicos: servicos.length > 0 ? servicos : [],
    observacoes: obs || null,
    terapeuta_nome: terapeuta,
    created_by_email: currentUser?.email || null,
    status: 'Ativo'
  };

  if(!demoMode && sbToken) {
    const {data, error} = await SB.insert('pacientes', paciente);
    if(error) {
      btn.textContent = 'Cadastrar Paciente';
      btn.disabled = false;
      erro.textContent = 'Erro ao salvar: ' + (typeof error === 'string' ? error : JSON.stringify(error));
      erro.style.display = 'block';
      console.error('Erro cadastro:', error);
      return;
    }
    // Add returned DB record to local cache
    const saved = data || paciente;
    if(!MOCK.pacientes[linha]) MOCK.pacientes[linha] = [];
    MOCK.pacientes[linha].push({
      id: saved.id || Date.now(),
      nome: saved.nome,
      idade: idade || '—',
      terapeuta: saved.terapeuta_nome || terapeuta,
      status: 'Ativo',
      servicos: saved.servicos || servicos,
      responsavel: saved.responsavel,
      escola: saved.escola,
      cl: {}
    });
    showToast('✅ '+nome+' cadastrado!','ok');
    openLinha(linha);
    return;
  }

  // Adicionar ao mock local para aparecer imediatamente na tela
  const novoPac = {
    id: Date.now(),
    nome, idade: idade||'—',
    terapeuta, status:'Ativo',
    servicos: servicos.length>0 ? servicos : [linha],
    responsavel: resp, escola,
    cl: {}
  };
  if(!MOCK.pacientes[linha]) MOCK.pacientes[linha] = [];
  MOCK.pacientes[linha].push(novoPac);

  showToast('✅ '+nome+' cadastrado!','ok');
  // Voltar para lista da linha
  openLinha(linha);
}

function switchTab(id,el){
  // Find the closest tab container to scope hiding correctly
  const target = document.getElementById(id);
  if(!target) return;
  // Determine prefix (pt- or or-) and only hide siblings with same prefix
  const prefix = id.replace(/\d+$/,'');
  const parent = target.parentElement;
  // Hide all siblings with same prefix
  parent.querySelectorAll('[id]').forEach(x=>{
    if(x.id.startsWith(prefix)) x.style.display='none';
  });
  target.style.display='block';
  // Only deactivate tabs in the same tab bar (closest .tabs sibling)
  let tabBar = parent.querySelector('.tabs');
  if(!tabBar){
    // tabs bar is a sibling before the content divs
    let sib = parent.previousElementSibling;
    while(sib){ if(sib.classList&&sib.classList.contains('tabs')){tabBar=sib;break;} sib=sib.previousElementSibling; }
  }
  if(tabBar) tabBar.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
}

window.addEventListener('DOMContentLoaded', async ()=>{
  // Try to restore session from localStorage
  const savedToken = localStorage.getItem('co_token');
  const savedUser  = localStorage.getItem('co_user');
  if(savedToken && savedUser) {
    try {
      sbToken = savedToken;
      currentUser = JSON.parse(savedUser);
      currentRole = currentUser.role;
      // Verify token is still valid
      const check = await SB.query('profissionais', `email=eq.${encodeURIComponent(currentUser.email)}&select=nivel_acesso&limit=1`);
      if(check && check.length > 0) {
        // Token valid - go straight to app
        document.getElementById('splash').classList.add('hide');
        startApp();
        return;
      }
    } catch(e) {}
    // Token invalid - clear and show login
    localStorage.removeItem('co_token');
    localStorage.removeItem('co_user');
  }
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    document.getElementById('loginScreen').style.display='flex';
  },1200);
});
window.addEventListener('resize',()=>{
  const app=document.getElementById('app');
  if(app.style.display!=='none') app.style.display=window.innerWidth>=768?'grid':'block';
});
